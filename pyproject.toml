[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gemma-lab"
version = "0.1.0"
description = "Config-driven local workflow for the Gemma developer agent competition"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
serve = ["vllm==0.33.0"]

[project.scripts]
gemma-lab = "gemma_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
